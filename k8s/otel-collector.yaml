apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: meeting-intelligence
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: meeting-intelligence
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector:0.120.0
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{containerPort: 4318}]
          volumeMounts:
            - {name: config, mountPath: /etc/otel}
      volumes:
        - name: config
          configMap: {name: otel-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: meeting-intelligence
spec:
  selector: {app: otel-collector}
  ports: [{port: 4318, targetPort: 4318}]
