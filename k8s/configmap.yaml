apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-intelligence
  namespace: meeting-intelligence
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  OPENROUTER_MODEL: google/gemma-4-26b-a4b-it:free
  EMBEDDING_MODEL: openai/text-embedding-3-small
  EMBEDDING_DIMENSIONS: "1536"
  REDIS_URL: redis://redis:6379/0
  UPLOAD_DIR: /app/uploads
  OTEL_SERVICE_NAME: meeting-intelligence
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  AGENT_HISTORY_TURNS: "6"
  # Set these to the provider's current per-million-token prices.
  LLM_INPUT_COST_PER_MILLION: "0"
  LLM_OUTPUT_COST_PER_MILLION: "0"
