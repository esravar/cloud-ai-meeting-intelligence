apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeting-intelligence
  namespace: meeting-intelligence
spec:
  ingressClassName: nginx
  rules:
    - host: meeting.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 80}}
